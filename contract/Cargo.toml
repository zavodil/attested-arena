[package]
name = "attested-arena"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Attested Arena's season contract: the sealed pool's commitment, entries, duels decided by the judge's signed results, the progress token and the sponsors' pool"

[lib]
crate-type = ["cdylib", "rlib"]

# Its own workspace: built with cargo near and NEAR's toolchain.
[workspace]

[dependencies]
near-sdk = { version = "=5.9.0", features = ["legacy"] }
near-contract-standards = "=5.9.0"
# The payloads the judge signs, as one definition shared with the judge.
arena-core = { path = "../core" }
schemars = "0.8"

[dev-dependencies]
near-sdk = { version = "=5.9.0", features = ["legacy", "unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
