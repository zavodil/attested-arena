[package]
name = "arena-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "An experiment, not part of the arena: another build that declares the judge's `pool` key and tries to open a sealed task"

[[bin]]
name = "arena-probe"
path = "src/main.rs"

[dependencies]
outlayer = { version = "=0.2.1", features = ["encryption-keys"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
