[package]
name = "arena-verify"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "arena-verify"
description = "Re-checks an Attested Arena season from NEAR state alone: the pool's root, every signature, every revealed task against its leaf, every answer against its model's TEE signature, every score against the same checker code, every duel's decision and every token minted"

[[bin]]
name = "arena-verify"
path = "src/main.rs"

[dependencies]
arena-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = "2"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
sha3 = { version = "0.10", default-features = false }
dcap-qvl = { version = "0.3.12", default-features = false, features = ["std", "rustcrypto"] }
